# Local development stack for FarmGo Connect.
# Host ports are offset from defaults to avoid clashing with other local projects.
name: farmgo
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: farmgo
      POSTGRES_PASSWORD: farmgo
      POSTGRES_DB: farmgo
    ports: ["127.0.0.1:5440:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmgo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6390:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: farmgo
      MINIO_ROOT_PASSWORD: farmgo-secret
    ports: ["127.0.0.1:9010:9000", "127.0.0.1:9011:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8030:8025", "127.0.0.1:1030:1025"]

volumes:
  pgdata:
  redisdata:
  miniodata:
