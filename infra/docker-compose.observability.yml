# Observability next to the production stack, on the same `farmgo` network:
#
#   infra/observability/setup.sh        # writes the scrape token file from .env.production
#   docker compose -f infra/docker-compose.observability.yml --env-file infra/.env.production up -d
#
# Prometheus scrapes every API replica (Docker DNS) and the worker with METRICS_TOKEN, and the
# autoscaler reads p95 latency from it. Set OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318 in the
# app env for traces. Nothing here is published publicly: reach Grafana over an SSH tunnel,
#   ssh -L 3003:127.0.0.1:3003 <user>@<vps>   then open http://localhost:3003
name: farmgo-observability

networks:
  default:
    name: farmgo
    external: true

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]

  promtail:
    image: grafana/promtail:3.2.0
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
    command: ["-config.file=/etc/promtail/config.yml"]

  tempo:
    image: grafana/tempo:2.6.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./observability/tempo.yml:/etc/tempo.yml:ro"]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:3003:3000"]

volumes:
  prometheus:
  grafana:
